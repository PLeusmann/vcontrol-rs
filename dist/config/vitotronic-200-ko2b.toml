# One entity from the start and end date. Each [[ferienprogramm]] takes:
# id = "..."                   # required; used in topics, discovery ids and `writable` instead of a command name
# display_name = "..."         # default: id
# start = "...", end = "..."   # required: the two date commands
# interval = 300               # default: poll_interval
[[ferienprogramm]]
id = "ferienprogramm_hk1"
display_name = "Ferienprogramm"
start = "FerienBeginnA1M1"
end = "FerienEndeA1M1"
interval = 3600
