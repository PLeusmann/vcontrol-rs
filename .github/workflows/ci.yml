# Self-contained: runs the same checks as `just`, in this repository's devcontainer.
on: [pull_request, push]

name: CI

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t vcontrol-dev .devcontainer

      # The tests start mosquitto, which the devcontainer provides.
      - run: |
          docker run --rm -u root -v "$PWD":/work -w /work vcontrol-dev sh -euxc '
            cargo +nightly fmt --check
            cargo clippy --features mqtt --all-targets -- -D warnings
            cargo test --features mqtt
          '
